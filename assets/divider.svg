<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="divider" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>divider</title>
<style>.f0{opacity:0;animation:flash0 2.89s 1.62s infinite steps(1,end)}
.f1{opacity:0;animation:flash1 4.02s 1.87s infinite steps(1,end)}
.f2{opacity:0;animation:flash2 3.02s 1.77s infinite steps(1,end)}
@keyframes flash0{0%{opacity:0}86%{opacity:1}87.5%{opacity:.15}89%{opacity:1}92%{opacity:0}}
@keyframes flash1{0%{opacity:0}70%{opacity:1}72%{opacity:0}73.5%{opacity:.9}76%{opacity:0}}
@keyframes flash2{0%{opacity:0}40%{opacity:.9}42%{opacity:.2}43%{opacity:1}45%{opacity:0}}
@media (prefers-reduced-motion:reduce){[class^=f]{animation:none!important;opacity:.35!important}}
.base{stroke-dasharray:6 10;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.base{animation:none}}</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textglow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
    <feFlood flood-color="#2563eb"/><feComposite in2="b" operator="in" result="g"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b2"/>
    <feFlood flood-color="#93c5fd"/><feComposite in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
