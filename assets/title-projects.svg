<g class="f1" filter="url(#glow)"><path d="M531.0,33.0 L613.0,42.7 L695.5,45.6 L778.0,48.7 L860.5,45.2 L943.0,47.4 L1025.5,45.9 L1107.5,36.5 L1190.0,33.0" stroke="#60a5fa" stroke-width="2"/><path d="M531.0,33.0 L613.0,42.7 L695.5,45.6 L778.0,48.7 L860.5,45.2 L943.0,47.4 L1025.5,45.9 L1107.5,36.5 L1190.0,33.0" stroke="#ffffff" stroke-width=".9"/></g>
