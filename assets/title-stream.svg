<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Off The Clock" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Off The Clock</title>
<style>@font-face{font-family:'Orb700';src:url(data:font/woff2;base64,) format('woff2');}.f0{opacity:0;animation:flash0 4.26s 1.05s infinite steps(1,end)}
.f1{opacity:0;animation:flash1 3.07s 0.67s infinite steps(1,end)}
@keyframes flash0{0%{opacity:0}86%{opacity:1}87.5%{opacity:.15}89%{opacity:1}92%{opacity:0}}
@keyframes flash1{0%{opacity:0}70%{opacity:1}72%{opacity:0}73.5%{opacity:.9}76%{opacity:0}}
@keyframes flash2{0%{opacity:0}40%{opacity:.9}42%{opacity:.2}43%{opacity:1}45%{opacity:0}}
@media (prefers-reduced-motion:reduce){[class^=f]{animation:none!important;opacity:.35!important}}
.t{font-family:'Orb700',Orbitron,'Segoe UI',sans-serif;font-size:28px;letter-spacing:6px;fill:#fff}</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textglow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
    <feFlood flood-color="#2563eb"/><feComposite in2="b" operator="in" result="g"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b2"/>
    <feFlood flood-color="#93c5fd"/><feComposite in2="b2" operator="in" result="g2"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<path d="M22,8 L8,36 H20 L14,58 L36,26 H24 L30,8 Z" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5" filter="url(#glow)"/>
<path d="M22,8 L8,36 H20 L14,58 L36,26 H24 L30,8 Z" fill="#ffffff" opacity=".35"/>
<text class="t" x="52" y="43" filter="url(#textglow)">OFF THE CLOCK</text>
<path d="M423,33 H1190" stroke="#1d4ed8" stroke-width="1.2" opacity=".6"/>
<g class="f0" filter="url(#glow)"><path d="M423.0,33.0 L519.0,34.7 L614.9,32.1 L710.5,22.8 L806.5,19.8 L902.4,23.6 L998.2,28.8 L1094.0,34.0 L1190.0,33.0" stroke="#60a5fa" stroke-width="2"/><path d="M423.0,33.0 L519.0,34.7 L614.9,32.1 L710.5,22.8 L806.5,19.8 L902.4,23.6 L998.2,28.8 L1094.0,34.0 L1190.0,33.0" stroke="#ffffff" stroke-width=".9"/></g>
<g class="f1" filter="url(#glow)"><path d="M423.0,33.0 L518.9,36.7 L614.6,43.3 L710.5,45.4 L806.5,45.5 L902.2,38.5 L998.2,37.5 L1094.0,32.6 L1190.0,33.0" stroke="#60a5fa" stroke-width="2"/><path d="M423.0,33.0 L518.9,36.7 L614.6,43.3 L710.5,45.4 L806.5,45.5 L902.2,38.5 L998.2,37.5 L1094.0,32.6 L1190.0,33.0" stroke="#ffffff" stroke-width=".9"/></g>
</svg>
