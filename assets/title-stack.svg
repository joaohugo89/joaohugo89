<g class="f1" filter="url(#glow)"><path d="M342.0,33.0 L448.0,31.9 L554.0,37.0 L660.0,39.0 L766.0,37.1 L872.0,35.6 L978.0,38.2 L1084.0,33.6 L1190.0,33.0" stroke="#60a5fa" stroke-width="2"/><path d="M342.0,33.0 L448.0,31.9 L554.0,37.0 L660.0,39.0 L766.0,37.1 L872.0,35.6 L978.0,38.2 L1084.0,33.6 L1190.0,33.0" stroke="#ffffff" stroke-width=".9"/></g>
