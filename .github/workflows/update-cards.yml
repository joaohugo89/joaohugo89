name: Update project cards

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 em Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards from starred repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: joaohugo89
          MAX_CARDS: "4"
          OWN_ONLY: "true" # "false" inclui repositórios de outras pessoas que você marcou com estrela
        run: python scripts/update_project_cards.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md assets/cards
            git commit -m "chore: update project cards from starred repos"
            git push
          else
            echo "Nothing changed."
          fi
